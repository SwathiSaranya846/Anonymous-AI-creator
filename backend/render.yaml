services:
  - type: web
    name: nova-autonomous-agent
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: FRONTEND_URL
        sync: false
      - key: AUTONOMY_INTERVAL_MINUTES
        value: "15"
      - key: MIN_PUBLISH_SCORE
        value: "72"
      - key: MAX_TOPICS_PER_CYCLE
        value: "8"
